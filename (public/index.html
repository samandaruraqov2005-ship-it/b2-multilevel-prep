<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B2 imtihon tayyorlovi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eceff4; --sheet:#fbfcfe; --ink:#14213d; --mut:#5b6678; --line:#cfd6e2;
  --mark:#ffd84d; --ok:#137a4b; --bad:#c62839; --pri:#14213d;
  --head:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0e1424;--sheet:#161e33;--ink:#e9edf7;--mut:#9aa6bd;--line:#2a3550;--mark:#ffd84d;--ok:#4cc38a;--bad:#ff7d8a;--pri:#e9edf7}
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 var(--body)}
main{max-width:780px;margin:0 auto;padding:20px 16px 80px}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.35rem;font-weight:800;margin-bottom:12px}
h3{font-size:1.05rem;font-weight:600;margin:18px 0 6px}
section.blk{background:var(--sheet);border:1px solid var(--line);border-left:6px solid var(--ink);padding:20px;margin:18px 0}
.mut{color:var(--mut);font-size:.95rem}
button{font:600 .95rem var(--head);background:var(--pri);color:var(--paper);border:0;padding:11px 18px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
textarea,input[type=date]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:0}
textarea{min-height:200px;resize:vertical}
.q{margin:16px 0}
.q p{margin:0 0 6px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);margin:4px 0;cursor:pointer}
.opt:hover{background:var(--paper)}
.opt input{margin-top:6px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.hero{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:8px 0 6px}
.big{font:800 5.5rem/0.9 var(--head);letter-spacing:-.04em}
.tally{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin:14px 0}
.t{height:34px;border:1px solid var(--line);display:grid;place-items:center;font:600 .75rem var(--head);color:var(--mut);background:var(--sheet)}
.t.done{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.t.cur{background:var(--mark);color:#14213d;border-color:#14213d;border-width:2px}
.t.lock{opacity:.45}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-family:var(--head);font-weight:600}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.hl{background:var(--mark);color:#14213d;padding:2px 6px}
.warn{border:2px solid var(--bad);padding:12px 14px;margin:14px 0;font-family:var(--head);font-weight:600}
.read{font-size:1.05rem;white-space:pre-line}
.words{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.words div{border:1px solid var(--line);padding:10px 12px}
.fix{border-left:4px solid var(--bad);padding:4px 12px;margin:10px 0}
.cnt{font:600 .85rem var(--head);color:var(--mut);margin-top:6px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
@media (prefers-reduced-motion:no-preference){.spin{animation:p 1.2s ease-in-out infinite}@keyframes p{50%{opacity:.35}}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY = "b2prep.v1";
let S = JSON.parse(localStorage.getItem(KEY) || "null") || { passed: {}, fails: {} };
let AI = true;
const app = document.getElementById("app");
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const today = () => new Date().toLocaleDateString("sv");
const dayDiff = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const wc = (s) => (s.trim().match(/\S+/g) || []).length;
const SK = ["vocabulary", "reading", "listening", "writing", "speaking"];
const SKN = { vocabulary: "Lug‘at", reading: "Reading", listening: "Listening", writing: "Writing", speaking: "Speaking" };

async function api(path, body) {
  const r = await fetch("/api/" + path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Server xatosi");
  return d;
}

/* ---------------- daraja testi ---------------- */
const PQ = [
["A2","She ___ to the gym every morning.",["go","goes","going","gone"],1],
["A2","I haven’t seen him ___ Monday.",["for","from","since","during"],2],
["A2","There isn’t ___ milk in the fridge.",["some","any","many","a"],1],
["A2","My brother is ___ than me.",["tall","taller","tallest","more tall"],1],
["B1","If it rains tomorrow, we ___ at home.",["will stay","would stay","stayed","stay"],0],
["B1","He asked me where ___.",["I lived","do I live","did I live","am I living"],0],
["B1","The report ___ by the manager yesterday.",["wrote","was written","has written","is writing"],1],
["B1","She is used to ___ up early.",["get","getting","got","be get"],1],
["B1","I ___ here for three years.",["live","am living","have lived","lived"],2],
["B1","The meeting was ___ because the manager was ill.",["called off","called up","called in","called out"],0],
["B1","You ___ wear a seatbelt; it is the law.",["must","might","could","would"],0],
["B1","Despite ___ tired, she finished the project.",["be","being","was","to be"],1],
["B2","If I ___ harder, I would have passed the exam.",["studied","had studied","would study","have studied"],1],
["B2","By this time next year, she ___ her degree.",["will finish","will have finished","finishes","is finishing"],1],
["B2","He denied ___ the money.",["to take","taking","take","took"],1],
["B2","I wish I ___ more time to prepare yesterday.",["had","had had","have","would have"],1],
["B2","The manager, ___ office is on the third floor, wants to see you.",["who","whom","whose","which"],2],
["B2","She must ___ the news; she looks really shocked.",["hear","have heard","be hearing","heard"],1],
["B2","His excuse for being late was totally ___; nobody believed him.",["convincing","implausible","reliable","sensible"],1],
["B2","Not only ___ the exam, but she also got the highest score.",["she passed","did she pass","she did pass","passed she"],1],
["C1","Hardly ___ the house when it started to rain.",["had she left","she had left","she left","did she leave"],0],
["C1","The proposal was met with widespread ___ among staff who doubted it would work.",["scepticism","ambition","generosity","reliance"],0],
["C1","It is high time you ___ about your future.",["think","thought","will think","have thought"],1],
["C1","Had I known about the delay, I ___ earlier.",["would leave","would have left","left","will have left"],1]
];

function viewPlacement() {
  app.innerHTML = `
  <h1>Darajangizni aniqlaymiz</h1>
  <p class="mut">24 ta savol va qisqa yozma namuna. Lug‘at ishlatmang, lug‘at va tarjimon ham yo‘q: haqiqiy daraja kerak. Reading, listening va speaking darajangiz birinchi 3 kunlik vazifalarda aniqlanadi.</p>
  <section class="blk"><h2>1. Imtihon sanasi</h2>
    <input type="date" id="exam" min="${today()}">
  </section>
  <section class="blk"><h2>2. Grammatika va lug‘at</h2>
    ${PQ.map((q, i) => `<div class="q"><p>${i + 1}. ${esc(q[1])}</p>${q[2].map((o, j) =>
      `<label class="opt"><input type="radio" name="p${i}" value="${j}"> ${esc(o)}</label>`).join("")}</div>`).join("")}
  </section>
  <section class="blk"><h2>3. Yozma namuna</h2>
    <p>Write about a time when you had to learn something difficult. What was hard, and how did you manage it? (kamida 80 so‘z)</p>
    <textarea id="pw"></textarea><div class="cnt" id="pwc">0 so‘z</div>
  </section>
  <div class="bar"><button id="go">Natijani ko‘rish</button></div>
  <p class="mut" id="perr"></p>`;
  const ta = document.getElementById("pw");
  ta.oninput = () => (document.getElementById("pwc").textContent = wc(ta.value) + " so‘z");
  document.getElementById("go").onclick = async () => {
    const err = document.getElementById("perr");
    const exam = document.getElementById("exam").value;
    if (!exam) return (err.textContent = "Imtihon sanasini kiriting.");
    if (dayDiff(today(), exam) < 7) return (err.textContent = "Imtihongacha kamida 7 kun bo‘lishi kerak.");
    const ans = PQ.map((_, i) => { const c = document.querySelector(`input[name=p${i}]:checked`); return c ? +c.value : -1; });
    if (ans.includes(-1)) return (err.textContent = "Hamma savollarga javob bering.");
    if (wc(ta.value) < 80) return (err.textContent = "Yozma namuna kamida 80 so‘z bo‘lsin.");
    const sc = { A2: 0, B1: 0, B2: 0, C1: 0 };
    PQ.forEach((q, i) => { if (ans[i] === q[3]) sc[q[0]]++; });
    let level = sc.B2 >= 5 && sc.B1 >= 6 ? (sc.C1 >= 3 ? "B2+" : "B2") : sc.B1 >= 5 ? "B1" : sc.A2 >= 3 ? "A2" : "A1";
    let wr = null;
    const btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "Tekshirilmoqda…";
    try { wr = await api("placement-writing", { text: ta.value }); } catch (e) { err.textContent = "Yozma namuna baholanmadi: " + e.message; }
    S = { ...S, level, scores: sc, writingCefr: wr && wr.cefr, writingNote: wr && wr.feedback, examDate: exam, startDate: today() };
    save(); viewPlacementResult();
  };
}

function viewPlacementResult() {
  const sc = S.scores;
  app.innerHTML = `
  <h1>Boshlang‘ich daraja: <span class="hl">${esc(S.level)}</span></h1>
  <section class="blk">
    <div class="row"><span>A2 savollari</span><span>${sc.A2}/4</span></div>
    <div class="row"><span>B1 savollari</span><span>${sc.B1}/8</span></div>
    <div class="row"><span>B2 savollari</span><span>${sc.B2}/8</span></div>
    <div class="row"><span>C1 savollari</span><span>${sc.C1}/4</span></div>
    ${S.writingCefr ? `<h3>Yozma namuna: ${esc(S.writingCefr)}</h3><p>${esc(S.writingNote)}</p>` : ""}
  </section>
  <p>Imtihon sanangiz: <b>${esc(S.examDate)}</b>. Bugundan boshlab har kuni bitta kun. Kunni topshirmasangiz yoki o‘tmasangiz, ertangi kun ochilmaydi.</p>
  <div class="bar"><button id="st">Rejaga o‘tish</button></div>`;
  document.getElementById("st").onclick = viewHome;
}

/* ---------------- bosh sahifa ---------------- */
const curDay = () => { let n = 1; while (S.passed[n]) n++; return n; };
function status(n) {
  if (S.passed[n]) return "done";
  if (n === 1) return "open";
  const p = S.passed[n - 1];
  if (!p) return "lock";
  return p.date < today() ? "open" : "wait";
}
function skillAvg() {
  const a = {}; const days = Object.values(S.passed);
  SK.forEach((k) => { const v = days.map((d) => d.scores[k]).filter((x) => x != null); a[k] = v.length ? Math.round(v.reduce((x, y) => x + y, 0) / v.length) : null; });
  return a;
}

function viewHome() {
  if (!S.level) return viewPlacement();
  const n = curDay(), st = status(n);
  const left = dayDiff(today(), S.examDate);
  const total = Math.min(150, Math.max(1, dayDiff(S.startDate, S.examDate)));
  const done = Object.keys(S.passed).length;
  const need = total - done;
  const avg = skillAvg();
  const weak = SK.filter((k) => avg[k] != null && avg[k] < 70);
  app.innerHTML = `
  <div class="hero"><span class="big">${Math.max(left, 0)}</span><div><h2 style="margin:0">kun qoldi</h2><span class="mut">Imtihon: ${esc(S.examDate)} · Daraja: ${esc(S.level)}</span></div></div>
  ${left < need ? `<div class="warn">Jadvaldan orqadasiz: ${need} kunlik vazifa qoldi, kalendarda esa ${Math.max(left, 0)} kun bor. Hech bir kunni o‘tkazib yubormang.</div>` : ""}
  <div class="tally">${Array.from({ length: total }, (_, i) => {
    const d = i + 1, s = d === n && !S.passed[d] ? "cur" : S.passed[d] ? "done" : "lock";
    return `<div class="t ${s}" title="${d}-kun">${d}</div>`; }).join("")}</div>
  <section class="blk">
    <h2>${n}-kun</h2>
    ${st === "open" ? `<p>Bugungi vazifa tayyor: lug‘at, reading, listening, writing, speaking. Taxminan 90 daqiqa.${S.fails[n] ? ` Oldingi urinishlar: ${S.fails[n]}.` : ""}</p><div class="bar"><button id="start">${S.cur && S.cur.day === n ? "Davom ettirish" : "Vazifani boshlash"}</button></div>`
    : st === "wait" ? `<p><b>Bugungi kun topshirildi.</b> ${n}-kun ertaga ochiladi.</p>`
    : `<p>Oldingi kunni topshiring.</p>`}
  </section>
  <section class="blk"><h2>Ko‘nikmalar bo‘yicha o‘rtacha</h2>
    ${SK.map((k) => `<div class="row"><span>${SKN[k]}</span><span class="${avg[k] == null ? "" : avg[k] >= 70 ? "pass" : "fail"}">${avg[k] == null ? "hali yo‘q" : avg[k] + "%"}</span></div>`).join("")}
    ${weak.length ? `<p class="mut">Sust joylar: ${weak.map((k) => SKN[k]).join(", ")}. Keyingi vazifalarda ularga urg‘u beriladi.</p>` : ""}
  </section>
  <p class="mut">O‘tish qoidasi: har bir blok kamida 60%, o‘rtacha kamida 70%. <button class="ghost" id="reset" style="padding:4px 10px;margin-left:8px">Hammasini boshidan</button></p>`;
  const b = document.getElementById("start"); if (b) b.onclick = () => viewDay(n);
  document.getElementById("reset").onclick = () => { if (confirm("Barcha natijalar o‘chadi. Rostdan ham?")) { localStorage.removeItem(KEY); S = { passed: {}, fails: {} }; viewPlacement(); } };
}

/* ---------------- kunlik vazifa ---------------- */
let plays = 0, rec = null;
async function viewDay(n) {
  app.innerHTML = `<h1>${n}-kun</h1><p class="spin">Vazifalar tayyorlanmoqda, 20–40 soniya kuting…</p>`;
  try {
    if (!(S.cur && S.cur.day === n)) {
      const avg = skillAvg();
      const weak = SK.filter((k) => avg[k] != null && avg[k] < 70);
      const r = await api("day", { day: n, level: S.level, weak });
      S.cur = { day: n, data: r.data, sealed: r.sealed, draft: { mcq: {}, writing: "", speaking: "" } };
      save();
    }
  } catch (e) {
    app.innerHTML = `<h1>${n}-kun</h1><div class="warn">${esc(e.message)}</div><div class="bar"><button id="b">Orqaga</button></div>`;
    document.getElementById("b").onclick = viewHome; return;
  }
  renderDay();
}

function mcq(prefix, qs) {
  const d = S.cur.draft.mcq;
  return qs.map((q, i) => `<div class="q"><p>${i + 1}. ${esc(q.q)}</p>${q.options.map((o, j) =>
    `<label class="opt"><input type="radio" name="${prefix}${i}" value="${j}" ${d[prefix + i] === j ? "checked" : ""}> ${esc(o)}</label>`).join("")}</div>`).join("");
}

function renderDay() {
  const c = S.cur, d = c.data; plays = 0;
  app.innerHTML = `
  <h1>${c.day}-kun · ${esc(d.theme)}</h1>
  <p class="mut">Hamma blokni bajaring, so‘ng pastdagi tugma bilan topshiring. Tekshiruvdan keyin javoblarni o‘zgartirib bo‘lmaydi.</p>

  <section class="blk"><h2>Lug‘at</h2>
    <div class="words">${d.vocab.map((v) => `<div><b>${esc(v.word)}</b> <span class="mut">${esc(v.pos)}</span><br>${esc(v.definition)}<br><i>${esc(v.example)}</i></div>`).join("")}</div>
    <h3>Mashq</h3>${mcq("v", d.vocabQuiz)}
  </section>

  <section class="blk"><h2>Reading: ${esc(d.reading.title)}</h2>
    <p class="read">${esc(d.reading.text)}</p>${mcq("r", d.reading.questions)}
  </section>

  <section class="blk"><h2>Listening</h2>
    <p class="mut">Matn ovoz bilan o‘qiladi, ko‘rsatilmaydi. Faqat 2 marta tinglash mumkin.</p>
    <button id="play">▶ Tinglash (2 marta qoldi)</button>${mcq("l", d.listening.questions)}
  </section>

  <section class="blk"><h2>Writing · ${esc(d.writing.type)}</h2>
    <p>${esc(d.writing.prompt)}</p><p class="mut">Kamida ${d.writing.minWords} so‘z.</p>
    <textarea id="w">${esc(c.draft.writing)}</textarea><div class="cnt" id="wcnt"></div>
  </section>

  <section class="blk"><h2>Speaking</h2>
    <p>${esc(d.speaking.prompt)}</p>
    <ul>${(d.speaking.points || []).map((p) => `<li>${esc(p)}</li>`).join("")}</ul>
    <p class="mut">Mikrofon tugmasini bosib 1–2 daqiqa inglizcha gapiring (Chrome kerak). Matn pastda paydo bo‘ladi, uni tahrirlash mumkin. Kamida 50 so‘z.</p>
    <button class="ghost" id="mic">🎙 Gapirishni boshlash</button>
    <textarea id="s" style="margin-top:10px">${esc(c.draft.speaking)}</textarea><div class="cnt" id="scnt"></div>
  </section>

  <div class="bar"><button id="sub">Topshirish va tekshirtirish</button><button class="ghost" id="back">Orqaga</button></div>
  <p class="mut" id="err"></p>`;

  const W = document.getElementById("w"), Sp = document.getElementById("s");
  const upd = () => { document.getElementById("wcnt").textContent = wc(W.value) + " / " + d.writing.minWords + " so‘z"; document.getElementById("scnt").textContent = wc(Sp.value) + " / 50 so‘z"; };
  W.oninput = () => { c.draft.writing = W.value; save(); upd(); };
  Sp.oninput = () => { c.draft.speaking = Sp.value; save(); upd(); };
  upd();
  app.onchange = (e) => { if (e.target.type === "radio") { c.draft.mcq[e.target.name] = +e.target.value; save(); } };

  const play = document.getElementById("play");
  play.onclick = () => {
    if (plays >= 2) return;
    plays++; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(d.listening.script); u.lang = "en-GB"; u.rate = 0.95; speechSynthesis.speak(u);
    play.textContent = plays >= 2 ? "Tinglash tugadi" : "▶ Yana tinglash (1 marta qoldi)"; play.disabled = plays >= 2;
  };

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById("mic");
  mic.onclick = () => {
    if (!SR) return alert("Brauzer ovozni matnga o‘tkazmaydi. Chrome ishlating yoki matnni qo‘lda yozing.");
    if (rec) { const r = rec; rec = null; r.stop(); mic.textContent = "🎙 Gapirishni boshlash"; return; }
    rec = new SR(); rec.lang = "en-US"; rec.continuous = true; rec.interimResults = false;
    rec.onresult = (e) => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) Sp.value += e.results[i][0].transcript + " "; Sp.dispatchEvent(new Event("input")); };
    rec.onend = () => { if (rec) try { rec.start(); } catch (_) {} };
    rec.start(); mic.textContent = "⏹ To‘xtatish";
  };

  document.getElementById("back").onclick = () => { speechSynthesis.cancel(); if (rec) { const r = rec; rec = null; r.stop(); } viewHome(); };
  document.getElementById("sub").onclick = submit;
}

async function submit() {
  const c = S.cur, d = c.data, err = document.getElementById("err");
  const pick = (p, n) => Array.from({ length: n }, (_, i) => { const x = document.querySelector(`input[name=${p}${i}]:checked`); return x ? +x.value : -1; });
  const v = pick("v", d.vocabQuiz.length), r = pick("r", d.reading.questions.length), l = pick("l", d.listening.questions.length);
  if ([...v, ...r, ...l].includes(-1)) return (err.textContent = "Hamma test savollariga javob bering.");
  const W = document.getElementById("w").value, Sp = document.getElementById("s").value;
  if (!confirm("Topshirasizmi? Keyin o‘zgartirib bo‘lmaydi.")) return;
  const btn = document.getElementById("sub"); btn.disabled = true; btn.textContent = "Tekshirilmoqda…";
  speechSynthesis.cancel(); if (rec) { const x = rec; rec = null; x.stop(); }
  try {
    const res = await api("grade", { sealed: c.sealed, vocab: v, reading: r, listening: l, writing: W, speaking: Sp });
    const n = c.day;
    if (res.passed) S.passed[n] = { date: today(), scores: res.sections, avg: res.average };
    else S.fails[n] = (S.fails[n] || 0) + 1;
    const snapshot = { d, mine: { v, r, l } };
    S.cur = null; save();
    viewResult(n, res, snapshot);
  } catch (e) { btn.disabled = false; btn.textContent = "Topshirish va tekshirtirish"; err.textContent = e.message; }
}

function review(title, qs, mine, correct) {
  return `<h3>${title}</h3>` + qs.map((q, i) => `<div class="q"><p>${i + 1}. ${esc(q.q)}</p>${q.options.map((o, j) =>
    `<div class="opt ${j === correct[i] ? "ok" : j === mine[i] ? "bad" : ""}">${esc(o)}</div>`).join("")}</div>`).join("");
}

function viewResult(n, res, snap) {
  const fx = (f) => f && f.fixes && f.fixes.length ? f.fixes.map((x) => `<div class="fix"><s>${esc(x.wrong)}</s> → <b>${esc(x.right)}</b><br><span class="mut">${esc(x.why)}</span></div>`).join("") : "";
  const fbk = (t, f) => f ? `<h3>${t}: ${esc(f.cefr || "")}</h3><p>${esc(f.feedback)}</p>${fx(f)}` : "";
  app.innerHTML = `
  <h1>${n}-kun: ${res.passed ? '<span class="pass">o‘tdi</span>' : '<span class="fail">o‘tmadi</span>'}</h1>
  <section class="blk">
    ${SK.map((k) => `<div class="row"><span>${SKN[k]}</span><span class="${res.sections[k] >= res.rules.sectionMin ? "pass" : "fail"}">${res.sections[k]}%</span></div>`).join("")}
    <div class="row"><span>O‘rtacha</span><span class="${res.average >= res.rules.avgMin ? "pass" : "fail"}">${res.average}%</span></div>
    ${res.notes.map((x) => `<p class="fail">${esc(x)}</p>`).join("")}
    ${res.passed ? `<p>Ertangi kun ertaga ochiladi.</p>` : `<p>Shart: har bir blok kamida ${res.rules.sectionMin}%, o‘rtacha kamida ${res.rules.avgMin}%. Past blok(lar): <b>${res.failed.map((k) => SKN[k]).join(", ") || "o‘rtacha past"}</b>. Bugun yangi vazifa bilan qayta topshirasiz.</p>`}
  </section>
  <section class="blk"><h2>Writing va speaking tahlili</h2>${fbk("Writing", res.feedback.writing)}${fbk("Speaking", res.feedback.speaking)}</section>
  <section class="blk"><h2>Test javoblari</h2>
    ${review("Lug‘at", snap.d.vocabQuiz, snap.mine.v, res.correct.vocab)}
    ${review("Reading", snap.d.reading.questions, snap.mine.r, res.correct.reading)}
    ${review("Listening", snap.d.listening.questions, snap.mine.l, res.correct.listening)}
    <h3>Listening matni</h3><p class="read">${esc(snap.d.listening.script)}</p>
  </section>
  <div class="bar"><button id="h">Bosh sahifa</button></div>`;
  document.getElementById("h").onclick = viewHome;
}

/* ---------------- boshlash ---------------- */
fetch("/api/status").then((r) => r.json()).then((s) => { AI = s.ai; }).catch(() => {}).finally(() => {
  if (!S.level) viewPlacement(); else viewHome();
  if (!AI) app.insertAdjacentHTML("afterbegin", `<div class="warn">Serverda ANTHROPIC_API_KEY yo‘q: kunlik vazifalar va writing/speaking tekshiruvi ishlamaydi.</div>`);
});
</script>
